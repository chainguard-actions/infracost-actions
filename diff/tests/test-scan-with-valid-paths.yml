name: Test scan - valid paths within workspace, scan attempted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create base and head path directories in workspace
        run: |
          mkdir -p "$GITHUB_WORKSPACE/base-checkout"
          mkdir -p "$GITHUB_WORKSPACE/head-checkout"
          # Create minimal terraform files so infracost has something to scan
          echo 'terraform {}' > "$GITHUB_WORKSPACE/base-checkout/main.tf"
          echo 'terraform {}' > "$GITHUB_WORKSPACE/head-checkout/main.tf"
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: "ic-fake-key-for-testing"
          version: "2"
          base-path: "./base-checkout"
          head-path: "./head-checkout"
          # Both paths exist in workspace: scan=true
          # No pull_request event: pr_status='', no status update
          # Docker will run but fake API key will cause infracost to fail
      - name: Assert action ran scan (failed gracefully with fake API key)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed scan (unexpected success with fake key)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (fake API key rejected by infracost)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
