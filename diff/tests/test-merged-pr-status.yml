name: Test merged PR status update
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # When pr-status=MERGED is explicitly set and no base-path/head-path are
      # provided, the action enters "status-only" mode. It will download the
      # scanner and call `infracost-scanner status --status MERGED`. With a fake
      # api-key the scanner will fail on authentication, but the action should
      # reach that point correctly.
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key
          pr-number: "10"
          pr-status: MERGED
          github-owner: infracost
          github-repo: actions
          # No base-path or head-path → status-only mode with MERGED status

      - name: Assert action ran in status-only mode for MERGED PR
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the fake api-key is rejected,
          # OR succeed if the scanner accepts the inputs. Either way it must
          # NOT fail before reaching the scanner invocation.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected: fake api-key rejected)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
