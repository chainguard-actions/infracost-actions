name: Test project filter input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with project input (expect failure - no real API key or scanner binary)
        id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key-for-test
          base-path: /tmp/base
          head-path: /tmp/head
          project: my-project
          pr-number: "1"
          github-owner: test-owner
          github-repo: test-repo

      - name: Assert action ran and failed gracefully (no scanner binary available)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (no scanner binary or API key available in test environment)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (scanner was available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
