name: Test explicit pr-status CLOSED - no scan, status update attempted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: "ic-fake-key-for-testing"
          version: "2"
          pr-status: "CLOSED"
          pr-number: "1"
          # No base-path or head-path: scan=false (paths missing)
          # pr-status=CLOSED: status update step will run (needs Docker + valid API key)
          # With a fake API key, the docker run will fail - that's expected
      - name: Assert action ran (scan skipped, status update attempted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed (status update succeeded unexpectedly)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (fake API key rejected by infracost)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
