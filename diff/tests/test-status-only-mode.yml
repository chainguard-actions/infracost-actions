name: Test status-only mode with explicit pr-status
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key
          pr-number: "42"
          pr-status: MERGED
          github-owner: test-owner
          github-repo: test-repo
          # No base-path or head-path → should enter status-only mode
          # The action will fail at "Update PR status" because api-key is fake,
          # but it should NOT fail at "Derive context" (PR number is provided).

      - name: Assert action failed at scanner (not at context derivation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the api-key is fake and the scanner
          # binary will reject it, OR it may fail downloading the binary.
          # Either way, it should NOT fail at "Derive context" since pr-number is set.
          # We accept failure (expected) but not success with a fake key.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (fake api-key or download issue)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should not succeed with a fake api-key"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
