name: Test status-only mode with explicit pr-status
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action in status-only mode (explicit pr-status, no paths)
        id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key
          github-owner: test-owner
          github-repo: test-repo
          pr-number: "42"
          pr-status: OPEN
          # No base-path or head-path — triggers status-only mode
          # The scanner binary will fail (fake API key), but the action
          # should reach the "Update PR status" step (not "Run scanner")

      - name: Assert action ran (failed gracefully on fake API key or sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail because:
          # 1. The Infracost API key is fake (scanner will reject it), OR
          # 2. The GitHub release download may fail in the test environment
          # Either way, it should fail gracefully (not panic/crash unexpectedly)
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (fake API key / test environment)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
