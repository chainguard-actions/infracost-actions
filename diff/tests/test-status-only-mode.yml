name: Test status-only mode with explicit pr-status
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # When pr-status is set but base-path/head-path are absent, the action
      # enters status-only mode. The scanner download and status update steps
      # will fail (fake API key / sentinel repo), but we assert on the outcome
      # gracefully.
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key-for-testing
          pr-number: "42"
          pr-status: MERGED
          github-owner: test-owner
          github-repo: test-repo

      - name: Assert action ran (failed gracefully on sentinel/fake-key)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail because:
          # 1. The scanner binary download may fail (no real release matching fake version), OR
          # 2. The status update step fails (fake API key / sentinel repo)
          # Either way, it must NOT fail at the "Derive context" step (PR number is provided).
          # We accept both success and failure here, but NOT an unexpected outcome.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed at scanner/status step (expected with fake credentials)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
