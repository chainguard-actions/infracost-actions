name: Test scan mode (base-path and head-path provided)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy base and head paths for scanning
        run: |
          mkdir -p /tmp/base-checkout
          mkdir -p /tmp/head-checkout
          echo "# dummy terraform" > /tmp/base-checkout/main.tf
          echo "# dummy terraform with change" > /tmp/head-checkout/main.tf

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key
          pr-number: "99"
          github-owner: infracost
          github-repo: actions
          base-path: /tmp/base-checkout
          head-path: /tmp/head-checkout
          # With base-path and head-path set and no explicit pr-status,
          # the action enters scan mode and runs infracost-scanner diff.
          # The scanner will fail with a fake API key, but the action
          # should reach the scanner step (not fail at context derivation).

      - name: Assert action ran in scan mode (failed at scanner with fake key)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake API key)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
