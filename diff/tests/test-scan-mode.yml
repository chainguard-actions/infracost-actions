name: Test scan mode context derivation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: "fake-api-key-for-testing"
          base-path: "${{ github.workspace }}/base"
          head-path: "${{ github.workspace }}/head"
          pr-number: "42"
          github-owner: "test-owner"
          github-repo: "test-repo"
          pr-status: ""

      - name: Assert action ran (fails gracefully without real API key or scanner binary)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail because:
          # 1. The infracost-scanner binary requires a real API key, OR
          # 2. The binary download may fail with a fake API key
          # Either way, it should fail gracefully (not with an unexpected error)
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no real API key/scanner)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (scanner may be available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
