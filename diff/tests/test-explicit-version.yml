name: Test explicit version input (non-latest)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with explicit version (skips gh release list)
        id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key
          version: "0.1.0"
          github-owner: test-owner
          github-repo: test-repo
          pr-number: "99"
          pr-status: MERGED
          # No base-path/head-path — status-only mode
          # With explicit version, the "Determine version" step skips gh release list
          # The "Download scanner" step will attempt to download version 0.1.0
          # The "Update PR status" step will fail with fake API key

      - name: Assert action ran (download or scanner failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Expected to fail at download (version may not exist) or scanner (fake key)
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
