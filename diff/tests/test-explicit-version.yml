name: Test explicit version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key
          version: "0.1.0"
          pr-number: "1"
          pr-status: OPEN
          github-owner: infracost
          github-repo: actions
          # Explicit version bypasses gh release list lookup
          # Will fail at download or scanner binary (fake API key)

      - name: Assert action ran (version step should not query releases)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at download (version may not exist) or
          # at the scanner binary (fake API key), but NOT at version determination.
          # Any failure or success is acceptable here — we just verify it ran.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake API key)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
