name: Test repo-url input override
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy base and head paths
        run: |
          mkdir -p "$GITHUB_WORKSPACE/base-checkout"
          mkdir -p "$GITHUB_WORKSPACE/head-checkout"

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: "fake-api-key-for-testing"
          base-path: "base-checkout"
          head-path: "head-checkout"
          repo-url: "https://github.com/example-org/example-repo"

      - name: Assert action ran with repo-url input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed or fail at the docker run step
          # (not at path validation, since paths exist). Either outcome is
          # acceptable — we just verify it ran with the repo-url input.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with repo-url input"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
