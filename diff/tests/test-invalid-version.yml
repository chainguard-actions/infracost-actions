name: Test invalid version inputs
on:
  workflow_dispatch:
jobs:
  test-version-below-minimum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Version 1 is below the minimum (2.0.0), should fail
      - id: action-v1
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key-for-test
          version: "1"

      - name: Assert action failed for version below minimum
        env:
          OUTCOME: ${{ steps.action-v1.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed for version 1 (below minimum 2.0.0)"
          else
            echo "FAIL: expected failure for version below minimum, got '$OUTCOME'"
            exit 1
          fi

  test-version-invalid-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Version with leading zeros is invalid
      - id: action-leading-zeros
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key-for-test
          version: "02.0.1"

      - name: Assert action failed for invalid version format
        env:
          OUTCOME: ${{ steps.action-leading-zeros.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed for version with leading zeros"
          else
            echo "FAIL: expected failure for invalid version format, got '$OUTCOME'"
            exit 1
          fi

  test-version-invalid-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # sha256: prefix with invalid digest (not 64 hex chars)
      - id: action-bad-digest
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key-for-test
          version: "sha256:notavaliddigest"

      - name: Assert action failed for invalid digest
        env:
          OUTCOME: ${{ steps.action-bad-digest.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed for invalid sha256 digest"
          else
            echo "FAIL: expected failure for invalid digest, got '$OUTCOME'"
            exit 1
          fi
