name: Test invalid pr-status value
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: "ic-fake-key-for-testing"
          version: "2"
          pr-status: "INVALID"
          # "INVALID" is not one of OPEN, MERGED, CLOSED and should fail
      - name: Assert action failed for invalid pr-status
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly rejected invalid pr-status value"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have rejected pr-status 'INVALID'"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
