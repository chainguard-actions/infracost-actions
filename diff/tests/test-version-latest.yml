name: Test version - latest tag accepted with warning
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          api-key: "ic-fake-key-for-testing"
          version: "latest"
          # 'latest' is valid but emits a warning - action should not fail
          # No base-path or head-path: scan=false, no Docker needed
          # No pull_request event: pr_status='', no status update
      - name: Assert action completed successfully with latest version
        run: |
          echo "PASS: action accepted 'latest' version (with warning)"
