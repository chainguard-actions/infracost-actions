name: Test version resolution with latest
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with version=latest and explicit pr-number
        id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key
          version: latest
          github-owner: test-owner
          github-repo: test-repo
          pr-number: "1"
          pr-status: OPEN
          # No base-path/head-path — status-only mode, skips scanner diff
          # The "Determine version" step will call gh release list for infracost/actions
          # The "Download scanner" step will attempt to download the binary
          # The "Update PR status" step will fail with fake API key

      - name: Assert action ran (version resolution succeeded or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may fail at download (network) or at scanner invocation (fake key)
          # Either outcome is acceptable — we're testing that version resolution
          # and the overall flow work without panicking
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake API key)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
