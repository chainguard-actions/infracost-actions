name: Test pinned version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # When a specific version is provided (not "latest"), the action skips the
      # gh release list call and uses the provided version directly.
      # The action will still fail at "Derive context" because no PR number is
      # available under workflow_dispatch, but the version step should succeed.
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key
          version: "0.1.0"
          # No pr-number → action will fail at context derivation, not at version step

      - name: Assert action failed at context step (not at version step)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action must fail (no PR number under workflow_dispatch),
          # but it should get past the version determination step since
          # a pinned version was supplied.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (no PR number), version step was bypassed correctly"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should not succeed without a PR number"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
