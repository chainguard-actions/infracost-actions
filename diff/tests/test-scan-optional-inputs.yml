name: Test scan with optional inputs (github-owner, github-repo, project)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy base and head paths
        run: |
          mkdir -p "$GITHUB_WORKSPACE/base-checkout"
          mkdir -p "$GITHUB_WORKSPACE/head-checkout"

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: "fake-api-key-for-testing"
          base-path: "base-checkout"
          head-path: "head-checkout"
          github-owner: "my-org"
          github-repo: "my-repo"
          project: "my-project"

      - name: Assert action ran and reached scanner (path validation passed)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed or fail at the docker run step
          # (not at path validation, since paths exist). Either outcome is
          # acceptable — we just verify it didn't fail before reaching the scanner.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with github-owner, github-repo, and project inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
