name: Test invalid version - below 2.0.0
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: "ic-fake-key-for-testing"
          version: "1"
          # version 1 is below 2.0.0 and should fail
      - name: Assert action failed for version below 2.0.0
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly rejected version below 2.0.0"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have rejected version 1 (below 2.0.0)"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
