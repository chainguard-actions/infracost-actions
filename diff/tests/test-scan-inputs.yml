name: Test scan inputs (base-path, head-path, project, repo-url)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy base and head paths
        run: |
          mkdir -p /tmp/base-checkout
          mkdir -p /tmp/head-checkout
          echo "resource \"null_resource\" \"example\" {}" > /tmp/base-checkout/main.tf
          echo "resource \"null_resource\" \"example\" {}" > /tmp/head-checkout/main.tf

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key-for-input-coverage
          base-path: /tmp/base-checkout
          head-path: /tmp/head-checkout
          project: my-project
          repo-url: https://github.com/example/repo
          pr-number: "1"
          github-owner: example
          github-repo: repo

      - name: Assert action covered scan inputs and failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail because:
          # - The Infracost API key is fake (no real credentials)
          # - The infracost-scanner binary may not be downloadable or will reject the key
          # What matters is that the inputs (base-path, head-path, project, repo-url)
          # were passed and the action ran (not skipped).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (scanner ran successfully)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with fake credentials"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
