name: Test scan inputs (base-path, head-path, project, repo-url)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy base and head paths
        run: |
          mkdir -p /tmp/base-checkout
          mkdir -p /tmp/head-checkout
          echo "resource \"null_resource\" \"example\" {}" > /tmp/base-checkout/main.tf
          echo "resource \"null_resource\" \"example\" {}" > /tmp/head-checkout/main.tf

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key-for-test
          base-path: /tmp/base-checkout
          head-path: /tmp/head-checkout
          project: my-project
          repo-url: https://github.com/example/repo
          pr-number: "1"
          github-token: ${{ github.token }}

      - name: Assert action ran (scan inputs were accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail because:
          # - The infracost-scanner binary requires a real API key
          # - The sentinel GITHUB_REPOSITORY means the GH API calls may fail
          # What matters is that the action ATTEMPTED to run with these inputs
          # (i.e., it did not fail at input validation before reaching the scanner).
          # Both 'success' and 'failure' are acceptable — 'skipped' is not.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped — inputs were not exercised"
            exit 1
          fi
          echo "PASS: action ran with base-path, head-path, project, and repo-url inputs (outcome: $OUTCOME)"
