name: Test scan inputs coverage (base-path, head-path, project, repo-url)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy base and head paths
        run: |
          mkdir -p /tmp/base-infra /tmp/head-infra
          echo "# dummy terraform" > /tmp/base-infra/main.tf
          echo "# dummy terraform" > /tmp/head-infra/main.tf

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: "fake-api-key-for-input-coverage"
          base-path: /tmp/base-infra
          head-path: /tmp/head-infra
          project: my-project
          pr-number: "1"
          repo-url: "https://github.com/example/repo"
          github-owner: "example"
          github-repo: "repo"

      - name: Assert action ran and covered inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail because:
          # - The api-key is fake (scanner will reject it)
          # - The scanner binary may not be downloadable or will fail to authenticate
          # But the important thing is that the inputs were accepted and processed.
          # We accept both success (unlikely) and failure (expected with fake credentials).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with fake credentials"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
