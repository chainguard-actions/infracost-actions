name: Test scan inputs (base-path, head-path, project, repo-url)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create base and head path directories
        run: |
          mkdir -p /tmp/base-checkout
          mkdir -p /tmp/head-checkout
          echo "# placeholder" > /tmp/base-checkout/main.tf
          echo "# placeholder" > /tmp/head-checkout/main.tf

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key-for-input-coverage
          base-path: /tmp/base-checkout
          head-path: /tmp/head-checkout
          project: my-project
          repo-url: https://github.com/example/repo
          pr-number: "1"
          github-token: ${{ github.token }}

      - name: Assert action ran with scan inputs (failed gracefully at download or scan step)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail because:
          # 1. The infracost scanner binary cannot be downloaded (no real release matching the env), OR
          # 2. The api-key is fake and the scanner rejects it.
          # Either way, the action should NOT fail at input validation — it should
          # reach the download or scan step before failing.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (scanner binary was available and ran)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected — scanner binary download or scan failed)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
