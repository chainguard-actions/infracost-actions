name: Test scan inputs (base-path, head-path, project, repo-url)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy base and head paths
        run: |
          mkdir -p /tmp/base-infra /tmp/head-infra
          echo 'resource "aws_instance" "example" { ami = "ami-0c55b159cbfafe1f0"; instance_type = "t2.micro" }' > /tmp/base-infra/main.tf
          echo 'resource "aws_instance" "example" { ami = "ami-0c55b159cbfafe1f0"; instance_type = "t3.micro" }' > /tmp/head-infra/main.tf

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: "fake-api-key-for-testing"
          base-path: /tmp/base-infra
          head-path: /tmp/head-infra
          project: my-test-project
          repo-url: https://github.com/example/repo
          pr-number: "1"
          github-owner: example
          github-repo: repo

      - name: Assert action ran with scan inputs (expected to fail gracefully without valid API key)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no valid API key / binary)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
