name: Test scan inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare base and head directories
        run: |
          mkdir -p /tmp/base-checkout /tmp/head-checkout
          echo 'resource "aws_instance" "example" { ami = "ami-0c55b159cbfafe1f0" instance_type = "t2.micro" }' \
            > /tmp/base-checkout/main.tf
          echo 'resource "aws_instance" "example" { ami = "ami-0c55b159cbfafe1f0" instance_type = "t3.large" }' \
            > /tmp/head-checkout/main.tf

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key-for-testing
          base-path: /tmp/base-checkout
          head-path: /tmp/head-checkout
          project: my-project
          repo-url: https://github.com/example/repo
          pr-number: "42"
          github-owner: example
          github-repo: repo

      - name: Assert action ran (inputs accepted, failed gracefully without real credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without real API key / scanner binary)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
