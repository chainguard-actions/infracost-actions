name: Test scan inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake base and head paths
        run: |
          mkdir -p /tmp/base-infra /tmp/head-infra
          echo "# base terraform" > /tmp/base-infra/main.tf
          echo "# head terraform" > /tmp/head-infra/main.tf

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key-for-test
          base-path: /tmp/base-infra
          head-path: /tmp/head-infra
          project: my-test-project
          repo-url: https://github.com/example/repo
          pr-number: "1"
          github-owner: example
          github-repo: repo

      - name: Assert action ran with scan inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail because it tries to download the
          # infracost-scanner binary from a real GitHub release, which is not
          # available in the test environment. What matters is that the inputs
          # (base-path, head-path, project, repo-url) were accepted and the
          # action attempted to run.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (scanner binary was available)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (scanner download not available in test env)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
