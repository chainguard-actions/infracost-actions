name: Test scan inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy base and head paths
        run: |
          mkdir -p /tmp/base-checkout
          mkdir -p /tmp/head-checkout
          echo "# dummy terraform" > /tmp/base-checkout/main.tf
          echo "# dummy terraform" > /tmp/head-checkout/main.tf

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key-for-coverage
          base-path: /tmp/base-checkout
          head-path: /tmp/head-checkout
          project: my-project
          repo-url: https://github.com/example/repo
          pr-number: "1"
          github-owner: example
          github-repo: repo

      - name: Assert action ran with scan inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail because:
          # 1. The Infracost API key is fake
          # 2. The scanner binary download may fail or the scanner itself will reject the fake key
          # We just need to confirm the action ran (not skipped) and that the inputs were accepted.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with base-path, head-path, project, and repo-url inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
