name: Test scan inputs (base-path, head-path, repo-url)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key
          base-path: /tmp/base
          head-path: /tmp/head
          repo-url: https://github.com/example/repo
          pr-number: "42"
          github-owner: example
          github-repo: repo

      - name: Assert action exercised base-path, head-path, and repo-url inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail because:
          # 1. It tries to download the infracost-scanner binary from GitHub releases
          #    using a real gh CLI call, which may fail without proper auth, OR
          # 2. The scanner binary itself fails with a fake API key.
          # Either way, the important thing is that the action was invoked with
          # base-path, head-path, and repo-url inputs (covering those inputs).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action was invoked with base-path, head-path, and repo-url inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
