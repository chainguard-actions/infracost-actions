name: Test scan inputs (base-path, head-path, project, repo-url)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: "fake-api-key-for-testing"
          base-path: "/tmp/base"
          head-path: "/tmp/head"
          project: "my-project"
          repo-url: "https://github.com/example/repo"
          pr-number: "42"
          github-owner: "example"
          github-repo: "repo"

      - name: Assert action exercised scan inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail because:
          # - The infracost API key is fake
          # - The base-path/head-path don't contain real IaC
          # - The scanner binary may not be available
          # What matters is that the action ran and attempted to use the inputs.
          # A failure here is acceptable (graceful failure on invalid inputs).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (scanner ran with provided inputs)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake API key / missing scanner)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
