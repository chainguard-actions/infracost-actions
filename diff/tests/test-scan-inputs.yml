name: Test scan inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy base and head paths
        run: |
          mkdir -p /tmp/base-checkout /tmp/head-checkout
          echo "# dummy terraform" > /tmp/base-checkout/main.tf
          echo "# dummy terraform" > /tmp/head-checkout/main.tf

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key
          base-path: /tmp/base-checkout
          head-path: /tmp/head-checkout
          project: my-project
          pr-number: "42"
          repo-url: https://github.com/example/repo
          github-owner: example
          github-repo: repo

      - name: Assert action ran with scan inputs (may fail due to missing scanner binary or invalid API key)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with scan inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected — scanner binary not available or API key invalid)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
