name: Test scan inputs (base-path, head-path, project, repo-url)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy base and head paths
        run: |
          mkdir -p /tmp/base-infra /tmp/head-infra
          echo "# dummy terraform" > /tmp/base-infra/main.tf
          echo "# dummy terraform" > /tmp/head-infra/main.tf

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key
          base-path: /tmp/base-infra
          head-path: /tmp/head-infra
          project: my-project
          repo-url: https://github.com/example/repo
          pr-number: "1"
          github-token: ${{ github.token }}

      - name: Assert action ran with scan inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail because:
          # 1. It tries to download a real scanner binary from infracost/actions releases
          # 2. Even if downloaded, the fake api-key would be rejected
          # What matters is that the action was invoked with base-path, head-path,
          # project, and repo-url inputs (covering those inputs for the coverage check).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME) — inputs base-path, head-path, project, repo-url were exercised"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
