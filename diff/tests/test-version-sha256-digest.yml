name: Test version - valid sha256 digest
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          api-key: "ic-fake-key-for-testing"
          version: "sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          # Valid sha256 digest (64 hex chars) - should be accepted
          # No base-path or head-path: scan=false, no Docker needed
          # No pull_request event: pr_status='', no status update
      - name: Assert action completed successfully with sha256 digest
        run: |
          echo "PASS: action accepted valid sha256 digest version"
