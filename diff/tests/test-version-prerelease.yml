name: Test version - prerelease tag accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          api-key: "ic-fake-key-for-testing"
          version: "2.1.0-rc.1"
          # Prerelease version - should be accepted (with possible warning about non-2.x)
          # No base-path or head-path: scan=false, no Docker needed
          # No pull_request event: pr_status='', no status update
      - name: Assert action completed successfully with prerelease version
        run: |
          echo "PASS: action accepted prerelease version '2.1.0-rc.1'"
