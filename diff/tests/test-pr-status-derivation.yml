name: Test PR status derivation
on:
  workflow_dispatch:
jobs:
  test-explicit-pr-status-open:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Explicit pr-status=OPEN: context step should set pr_status=OPEN
      # scan=false because no base-path/head-path provided
      # Update PR status step WILL run (pr_status != '') but will fail without real API key
      - id: action-open
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key-for-test
          version: "2"
          pr-status: "OPEN"
          # No base-path/head-path so scan is skipped

      - name: Assert action ran with OPEN pr-status
        env:
          OUTCOME: ${{ steps.action-open.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action will attempt to update PR status via Docker (which may fail
          # without a real API key or if Docker pull fails), but it should not fail
          # at the version resolution or context derivation steps.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with explicit OPEN pr-status (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

  test-explicit-pr-status-merged:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Explicit pr-status=MERGED: scan should still be false (no paths),
      # Update PR status step will run
      - id: action-merged
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key-for-test
          version: "2"
          pr-status: "MERGED"

      - name: Assert action ran with MERGED pr-status
        env:
          OUTCOME: ${{ steps.action-merged.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with explicit MERGED pr-status (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

  test-invalid-pr-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Invalid pr-status value should cause the context step to fail
      - id: action-invalid-status
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key-for-test
          version: "2"
          pr-status: "INVALID_STATUS"

      - name: Assert action failed for invalid pr-status
        env:
          OUTCOME: ${{ steps.action-invalid-status.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed for invalid pr-status value"
          else
            echo "FAIL: expected failure for invalid pr-status, got '$OUTCOME'"
            exit 1
          fi
