name: Test action fails gracefully without PR number
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without PR number (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key
          github-owner: test-owner
          github-repo: test-repo
          # No pr-number provided — workflow_dispatch has no PR context
          # Action should fail at "Derive context" step

      - name: Assert action failed gracefully (no PR number)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected when no PR number is available"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed without a PR number"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
