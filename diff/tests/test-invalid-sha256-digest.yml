name: Test invalid version - bad sha256 digest
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: "ic-fake-key-for-testing"
          version: "sha256:tooshort"
          # sha256 digest must be 64 hex chars; "tooshort" is invalid
      - name: Assert action failed for invalid sha256 digest
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly rejected invalid sha256 digest"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have rejected sha256:tooshort"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
