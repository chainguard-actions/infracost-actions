name: Test missing PR number error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: "fake-api-key-for-testing"
          github-owner: "test-owner"
          github-repo: "test-repo"
          # No pr-number provided, and this is workflow_dispatch (not pull_request)
          # so github.event.pull_request.number will be empty.
          # The action should fail with:
          # "Could not determine PR number. Either run on a pull_request event or set the pr-number input."

      - name: Assert action failed with PR number error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action MUST fail because no PR number is available.
          # It should exit 1 in the "Derive context" step.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (no PR number)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed without a PR number"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
