name: Test missing PR number error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key
          # No pr-number provided and workflow_dispatch has no PR context
          # The action should fail with "Could not determine PR number"

      - name: Assert action failed with missing PR number error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when PR number could not be determined"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed without a PR number"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
