name: Test missing PR number error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action requires a PR number. Under workflow_dispatch there is no
      # github.event.pull_request.number, and we don't supply pr-number input,
      # so the "Derive context" step should exit 1 with a clear error message.
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key
          # No pr-number provided — action must fail with a descriptive error

      - name: Assert action failed due to missing PR number
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected when no PR number is available"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed without a PR number"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
