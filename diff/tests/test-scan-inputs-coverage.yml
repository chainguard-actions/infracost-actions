name: Test scan inputs coverage (base-path, head-path, project, repo-url)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake base and head paths
        run: |
          mkdir -p /tmp/base-infra
          mkdir -p /tmp/head-infra
          echo "# fake terraform" > /tmp/base-infra/main.tf
          echo "# fake terraform" > /tmp/head-infra/main.tf

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key-for-coverage-test
          base-path: /tmp/base-infra
          head-path: /tmp/head-infra
          project: my-project
          repo-url: https://github.com/example/repo
          pr-number: "1"
          github-owner: example
          github-repo: repo

      - name: Assert action ran with scan inputs (may fail at scanner binary step)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail because:
          # 1. The infracost-scanner binary may not be downloadable, OR
          # 2. The scanner binary will reject the fake api-key / fake paths
          # Either way, the action should fail gracefully (not with an unexpected error).
          # We accept both success and failure as valid outcomes here,
          # but NOT a skipped outcome.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was unexpectedly skipped"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME) — base-path, head-path, project, and repo-url inputs were exercised"
