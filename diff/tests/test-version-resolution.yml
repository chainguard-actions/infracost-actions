name: Test version resolution
on:
  workflow_dispatch:
jobs:
  test-version-numeric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test numeric version 2 resolves to ghcr.io/infracost/ci:2
      - id: action-v2
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key-for-test
          version: "2"
          # No base-path/head-path so scan is skipped
          # No pr-status so update PR status is skipped

      - name: Assert action ran (image step succeeded, scan skipped)
        env:
          OUTCOME: ${{ steps.action-v2.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should succeed: image resolves, context derives (no PR status),
          # scan is skipped (no paths), update PR status is skipped (no pr_status).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with version 2"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness without real API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

  test-version-semver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test semver version 2.0.1 resolves to ghcr.io/infracost/ci:2.0.1
      - id: action-semver
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key-for-test
          version: "2.0.1"

      - name: Assert action ran with semver version
        env:
          OUTCOME: ${{ steps.action-semver.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed (success or graceful failure) with version 2.0.1"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
