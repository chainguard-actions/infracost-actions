name: Test scan - nonexistent base-path and head-path fail gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: "ic-fake-key-for-testing"
          version: "2"
          base-path: "./nonexistent-base"
          head-path: "./nonexistent-head"
          # Both paths are provided so scan=true, but the paths don't exist
          # The action should fail with "does not exist" error
      - name: Assert action failed for nonexistent paths
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed for nonexistent paths"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed for nonexistent paths"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
