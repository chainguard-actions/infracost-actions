name: Test scan with base-path, head-path, project, and repo-url inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key-for-test
          base-path: /tmp/base
          head-path: /tmp/head
          project: my-project
          repo-url: https://github.com/example/repo
          pr-number: "42"
          github-owner: example
          github-repo: repo

      - name: Assert action ran (scan mode with paths, fails gracefully without real binary/credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without real infracost credentials or binary)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
