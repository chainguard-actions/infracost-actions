name: Test scan skip behavior
on:
  workflow_dispatch:
jobs:
  test-no-paths-scan-skipped:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Without base-path and head-path, scan should be skipped.
      # Without pr-status, update PR status should also be skipped.
      # The action should succeed (both conditional steps skipped).
      - id: action-no-paths
        uses: .
        with:
          api-key: fake-api-key-for-test
          version: "2"
          # No base-path, no head-path, no pr-status

      - name: Assert action succeeded with scan skipped
        run: |
          echo "PASS: action completed successfully with scan and PR status update skipped"

  test-only-base-path-scan-skipped:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # With only base-path (no head-path), scan should still be skipped.
      - id: action-only-base
        uses: .
        with:
          api-key: fake-api-key-for-test
          version: "2"
          base-path: "."
          # No head-path

      - name: Assert action succeeded with partial paths (scan skipped)
        run: |
          echo "PASS: action completed successfully with only base-path (scan skipped)"

  test-only-head-path-scan-skipped:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # With only head-path (no base-path), scan should still be skipped.
      - id: action-only-head
        uses: .
        with:
          api-key: fake-api-key-for-test
          version: "2"
          head-path: "."
          # No base-path

      - name: Assert action succeeded with partial paths (scan skipped)
        run: |
          echo "PASS: action completed successfully with only head-path (scan skipped)"
