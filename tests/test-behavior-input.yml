name: Test behavior input validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/pull/1/merge
      GITHUB_EVENT_NAME: pull_request
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify behavior input description mentions valid values
        run: |
          echo "Checking behavior input description for valid values..."
          VALID_BEHAVIORS="update delete-and-new hide-and-new new"
          for behavior in $VALID_BEHAVIORS; do
            if ! grep -q "$behavior" "$GITHUB_WORKSPACE/action.yml"; then
              echo "FAIL: behavior value '$behavior' not documented in action.yml"
              exit 1
            fi
            echo "PASS: behavior value '$behavior' found in action.yml"
          done

      - name: Verify infracost comment step uses behavior input
        run: |
          echo "Checking that Post Infracost comment step uses behavior input..."
          if ! grep -q "COMMENT_BEHAVIOR" "$GITHUB_WORKSPACE/action.yml"; then
            echo "FAIL: COMMENT_BEHAVIOR env var not found in action.yml"
            exit 1
          fi
          echo "PASS: COMMENT_BEHAVIOR env var found"

          if ! grep -q 'inputs.behavior' "$GITHUB_WORKSPACE/action.yml"; then
            echo "FAIL: inputs.behavior reference not found in action.yml"
            exit 1
          fi
          echo "PASS: inputs.behavior reference found"

      - name: Verify infracost breakdown path usage
        run: |
          echo "Checking that infracost breakdown uses path input..."
          if ! grep -q "infracost breakdown" "$GITHUB_WORKSPACE/action.yml"; then
            echo "FAIL: infracost breakdown command not found in action.yml"
            exit 1
          fi
          echo "PASS: infracost breakdown command found"

      - name: Verify infracost comment github step exists
        run: |
          echo "Checking that infracost comment github step exists..."
          if ! grep -q "infracost comment github" "$GITHUB_WORKSPACE/action.yml"; then
            echo "FAIL: infracost comment github command not found in action.yml"
            exit 1
          fi
          echo "PASS: infracost comment github command found"

      - name: Verify GITHUB_TOKEN is used for PR commenting
        run: |
          echo "Checking that GITHUB_TOKEN is used..."
          if ! grep -q "GITHUB_TOKEN" "$GITHUB_WORKSPACE/action.yml"; then
            echo "FAIL: GITHUB_TOKEN not found in action.yml"
            exit 1
          fi
          echo "PASS: GITHUB_TOKEN found"

          if ! grep -q "github.token" "$GITHUB_WORKSPACE/action.yml"; then
            echo "FAIL: github.token reference not found in action.yml"
            exit 1
          fi
          echo "PASS: github.token reference found"

      # Invoke the action under test with a non-default behavior value.
      # It requires external services so it will fail at runtime in act —
      # continue-on-error allows the structural assertions above to be the
      # primary test signal.
      - id: infracost
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key-for-lint
          path: .
          behavior: new
