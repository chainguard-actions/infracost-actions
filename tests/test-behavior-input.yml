name: Test behavior input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test with update behavior (default)
        id: action-update
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key-for-testing
          path: .
          behavior: update

      - name: Assert update behavior step ran
        env:
          OUTCOME: ${{ steps.action-update.outcome }}
        run: |
          echo "outcome (update): $OUTCOME"
          # The action requires PR context and infracost CLI; expected to fail gracefully
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran with behavior=update, outcome=$OUTCOME"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Test with delete-and-new behavior
        id: action-delete-and-new
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key-for-testing
          path: .
          behavior: delete-and-new

      - name: Assert delete-and-new behavior step ran
        env:
          OUTCOME: ${{ steps.action-delete-and-new.outcome }}
        run: |
          echo "outcome (delete-and-new): $OUTCOME"
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran with behavior=delete-and-new, outcome=$OUTCOME"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Test with new behavior
        id: action-new
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key-for-testing
          path: .
          behavior: new

      - name: Assert new behavior step ran
        env:
          OUTCOME: ${{ steps.action-new.outcome }}
        run: |
          echo "outcome (new): $OUTCOME"
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran with behavior=new, outcome=$OUTCOME"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
