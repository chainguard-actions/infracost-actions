name: Test behavior input variants
on:
  workflow_dispatch:
jobs:
  test-update-behavior:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test with behavior=update (the default). The action requires a PR context,
      # infracost CLI, and a real API key — none of which are available under
      # workflow_dispatch with the sentinel repo. We verify it fails gracefully.
      - id: action-update
        uses: .
        continue-on-error: true
        with:
          api-key: "fake-api-key-for-testing"
          path: "."
          behavior: "update"

      - name: Assert update behavior fails gracefully
        env:
          OUTCOME: ${{ steps.action-update.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully with behavior=update (expected: no PR context)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (infracost available in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

  test-new-behavior:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test with behavior=new. Same constraints apply.
      - id: action-new
        uses: .
        continue-on-error: true
        with:
          api-key: "fake-api-key-for-testing"
          path: "."
          behavior: "new"

      - name: Assert new behavior fails gracefully
        env:
          OUTCOME: ${{ steps.action-new.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully with behavior=new (expected: no PR context)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (infracost available in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

  test-delete-and-new-behavior:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test with behavior=delete-and-new. Same constraints apply.
      - id: action-delete-new
        uses: .
        continue-on-error: true
        with:
          api-key: "fake-api-key-for-testing"
          path: "."
          behavior: "delete-and-new"

      - name: Assert delete-and-new behavior fails gracefully
        env:
          OUTCOME: ${{ steps.action-delete-new.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully with behavior=delete-and-new (expected: no PR context)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (infracost available in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
