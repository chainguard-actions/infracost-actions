name: Test behavior input variants
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action accepts the 'new' behavior value.
      # The action is designed for PR workflows and will fail under workflow_dispatch
      # because there is no pull_request context and no real Infracost API key.
      # We assert it fails gracefully (not with an unexpected/unhandled error).
      - id: action-new-behavior
        uses: .
        continue-on-error: true
        with:
          api-key: "test-api-key-placeholder"
          path: "."
          behavior: new

      - name: Assert action ran with new behavior and failed gracefully
        env:
          OUTCOME: ${{ steps.action-new-behavior.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (PR context not available under workflow_dispatch)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      # Test that the action accepts the 'delete-and-new' behavior value.
      - id: action-delete-and-new-behavior
        uses: .
        continue-on-error: true
        with:
          api-key: "test-api-key-placeholder"
          path: "."
          behavior: delete-and-new

      - name: Assert action ran with delete-and-new behavior and failed gracefully
        env:
          OUTCOME: ${{ steps.action-delete-and-new-behavior.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (PR context not available under workflow_dispatch)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
