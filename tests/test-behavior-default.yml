name: Test behavior input default value
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action accepts the default behavior ('update') when
      # behavior input is not explicitly provided. The action will fail at
      # the infracost CLI step (not installed), but the input handling should
      # succeed. We use continue-on-error to capture the expected failure.
      - id: action-default-behavior
        uses: .
        continue-on-error: true
        with:
          api-key: "test-api-key-placeholder"
          path: "."
          # behavior is intentionally omitted to test the default value of 'update'

      - name: Assert action was invoked with default behavior
        env:
          OUTCOME: ${{ steps.action-default-behavior.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action is expected to fail because infracost CLI is not installed.
          # A 'failure' or 'success' outcome means the action was invoked correctly
          # with the default behavior input.
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action accepted default behavior input (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
