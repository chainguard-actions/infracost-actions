name: Test default behavior input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action accepts inputs without the optional 'behavior' field,
      # relying on the default value of 'update'. The action will fail at the
      # infracost CLI step (not installed), but we verify it was invoked correctly.
      - id: action
        uses: .
        with:
          api-key: test-api-key-placeholder
          path: .
          # behavior is intentionally omitted to test the default value of 'update'
        continue-on-error: true

      - name: Assert action was invoked with default behavior
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should be invoked (not skipped), even without 'behavior' input.
          # It will fail at the infracost CLI step since infracost is not installed,
          # but the default input handling should work correctly.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to be invoked"
            exit 1
          fi
          echo "PASS: action was invoked with default behavior input (outcome=$OUTCOME)"
