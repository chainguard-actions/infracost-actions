name: Test default behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test with default behavior (no behavior input)
        id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key-for-testing
          path: .
          # behavior is not specified — should default to 'update'

      - name: Assert action ran with default behavior
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail under the harness because:
          # 1. The checkout of pull_request.base.ref fails (no PR context under workflow_dispatch)
          # 2. infracost CLI is not installed
          # 3. GITHUB_REPOSITORY is a sentinel (not a real repo)
          # We verify the action at least attempted to run (outcome is not skipped/cancelled).
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no PR context / infracost not installed)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          else
            echo "FAIL: unexpected outcome '$OUTCOME' (expected failure or success, not '$OUTCOME')"
            exit 1
          fi
