name: Test default behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action can be invoked without specifying behavior (uses default 'update')
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key-for-testing
          path: .
          # behavior not specified — should default to 'update'

      - name: Assert action ran with default behavior
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action requires a real PR context (pull_request event with base.ref set),
          # a working Infracost API key, and the infracost CLI installed.
          # Under workflow_dispatch with the sentinel repo, it is expected to fail.
          # We verify it either fails gracefully or succeeds — not an unexpected state.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no PR context / infracost CLI not available)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (infracost available in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
