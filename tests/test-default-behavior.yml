name: Test default behavior input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key-for-testing
          path: .
          # behavior is omitted to test the default value of 'update'

      - name: Assert action ran and failed gracefully with default behavior
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Under act, this action cannot succeed because:
          # 1. The infracost CLI is not installed
          # 2. There is no real pull_request context (github.event.pull_request.base.ref is empty)
          # 3. The sentinel GITHUB_REPOSITORY is not a real repo
          # We verify the action accepts the default 'update' behavior and fails gracefully.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected in harness environment"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action unexpectedly succeeded"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
