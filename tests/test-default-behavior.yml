name: Test default behavior (update)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action works without specifying the optional 'behavior'
      # input (it should default to 'update'). The action requires infracost
      # CLI and a real PR context, so it will fail under the harness. We
      # assert it fails gracefully.
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key-for-testing
          path: examples/terraform-directory/code
          # behavior is intentionally omitted to test the default value of 'update'

      - name: Assert action ran and failed gracefully with default behavior
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no PR context / infracost CLI under harness)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action unexpectedly succeeded"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
