name: Test basic PR usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/pull/1/merge
      GITHUB_EVENT_NAME: pull_request
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify action.yml exists
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/action.yml" ]; then
            echo "FAIL: action.yml not found in workspace"
            exit 1
          fi
          echo "PASS: action.yml found"

      - name: Verify required inputs are declared in action.yml
        run: |
          echo "Checking action.yml for required inputs..."
          if ! grep -q "api-key:" "$GITHUB_WORKSPACE/action.yml"; then
            echo "FAIL: api-key input not found in action.yml"
            exit 1
          fi
          echo "PASS: api-key input found"

          if ! grep -q "path:" "$GITHUB_WORKSPACE/action.yml"; then
            echo "FAIL: path input not found in action.yml"
            exit 1
          fi
          echo "PASS: path input found"

          if ! grep -q "behavior:" "$GITHUB_WORKSPACE/action.yml"; then
            echo "FAIL: behavior input not found in action.yml"
            exit 1
          fi
          echo "PASS: behavior input found"

      - name: Verify default behavior value
        run: |
          echo "Checking default behavior value..."
          if ! grep -A2 "behavior:" "$GITHUB_WORKSPACE/action.yml" | grep -q "update"; then
            echo "FAIL: default behavior 'update' not found in action.yml"
            exit 1
          fi
          echo "PASS: default behavior 'update' found"

      - name: Verify action uses composite runner
        run: |
          echo "Checking action uses composite runner..."
          if ! grep -q 'using: "composite"' "$GITHUB_WORKSPACE/action.yml"; then
            echo "FAIL: action does not use composite runner"
            exit 1
          fi
          echo "PASS: action uses composite runner"

      - name: Verify action metadata
        run: |
          echo "Checking action metadata..."
          if ! grep -q "name: Infracost Actions" "$GITHUB_WORKSPACE/action.yml"; then
            echo "FAIL: action name not found"
            exit 1
          fi
          echo "PASS: action name found"

          if ! grep -q "author: infracost" "$GITHUB_WORKSPACE/action.yml"; then
            echo "FAIL: author not found"
            exit 1
          fi
          echo "PASS: author found"

      # Invoke the action under test. It requires external services (Infracost API,
      # GitHub API) so it will fail at runtime in act — continue-on-error allows
      # the structural assertions above to still be the primary test signal.
      - id: infracost
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key-for-lint
          path: .
          behavior: update
