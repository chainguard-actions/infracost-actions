name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action is designed for PR workflows: it checks out the PR base branch,
      # installs Infracost, runs breakdown, and posts a PR comment.
      # Under act/workflow_dispatch:
      #   - github.event.pull_request.base.ref is empty → the internal checkout step
      #     will check out the default branch (or fail gracefully)
      #   - GITHUB_REPOSITORY is a sentinel that does not exist on GitHub
      #   - No real Infracost API key is available in this test environment
      # Therefore the action is expected to fail; we assert it fails gracefully
      # rather than hanging or producing an unexpected error type.
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: "test-api-key-placeholder"
          path: "."
          behavior: update

      - name: Assert action ran and failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (PR context not available under workflow_dispatch)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (environment may have Infracost configured)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
