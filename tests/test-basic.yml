name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action requires an api-key and path. Under the harness:
      # - There is no real PR context (pull_request.base.ref, pull_request.number are empty)
      # - The Infracost CLI setup step will fail without a valid API key
      # - The sentinel GITHUB_REPOSITORY means repo-scoped API calls will fail
      # We verify the action fails gracefully (not with an unexpected crash).
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: "test-api-key-placeholder"
          path: "."
          behavior: update

      - name: Assert action ran (failed gracefully without real PR context or valid API key)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no real PR context or valid API key under harness)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (possibly a no-op path)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
