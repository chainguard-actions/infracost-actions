name: Test basic usage - required inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action requires an api-key and path. Under the harness:
      # - github.event.pull_request.base.ref is empty (workflow_dispatch, not pull_request)
      # - The infracost CLI may not be installed
      # - The sentinel GITHUB_REPOSITORY is not a real repo
      # So the action is expected to fail. We assert it fails gracefully (not with an
      # unexpected outcome like "skipped").
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key-for-testing
          path: .

      - name: Assert action ran (failed gracefully due to harness constraints)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected under harness (no real PR context or Infracost API key)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action unexpectedly succeeded"
          else
            echo "FAIL: unexpected outcome '$OUTCOME' (expected 'failure' or 'success')"
            exit 1
          fi
