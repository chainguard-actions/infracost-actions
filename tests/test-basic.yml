name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key-for-testing
          path: .

      - name: Assert action ran (fails gracefully without PR context and real infracost setup)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # This action requires a real PR context (pull_request event with base.ref),
          # a real Infracost API key, and the infracost CLI installed.
          # Under workflow_dispatch with the sentinel repo, it is expected to fail.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no PR context / infracost CLI not available)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (infracost may be available in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
