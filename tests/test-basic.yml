name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action requires a real PR context (pull_request.base.ref, pull_request.number),
      # a valid Infracost API key, and makes repo-scoped GitHub API calls.
      # Under the harness, GITHUB_REPOSITORY is a sentinel and there is no real PR,
      # so the action will fail gracefully. We assert on the outcome.
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: "test-api-key-placeholder"
          path: "."
          behavior: update

      - name: Assert action ran and failed gracefully (no real PR or API key under harness)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no real PR context or valid API key under harness)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (real environment?)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
