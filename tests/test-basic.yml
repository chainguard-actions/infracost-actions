name: Test basic usage (graceful failure without PR context)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action requires a PR context (pull_request.base.ref, pull_request.number),
      # an Infracost API key, and the infracost CLI. Under workflow_dispatch with the
      # sentinel repo, these are unavailable. We verify the action fails gracefully
      # (not with an unexpected/unrelated error).
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: "fake-api-key-for-testing"
          path: "."
          behavior: "update"

      - name: Assert action ran and failed gracefully (no PR context available)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no PR context / no infracost CLI / sentinel repo)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action unexpectedly succeeded (infracost may be available in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
