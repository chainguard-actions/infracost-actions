name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action is a placeholder that requires a real PR context, Infracost CLI,
      # and a real GitHub repository. It will fail gracefully under the harness
      # because: (1) GITHUB_REPOSITORY is a sentinel, (2) there is no real PR,
      # (3) the Infracost CLI may not be installed, and (4) the hardcoded path
      # examples/terraform-directory/code does not exist.
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: "test-api-key-placeholder"
          path: "."
          behavior: "update"

      - name: Assert action ran (succeeded or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under harness — no real PR, sentinel repo, or Infracost CLI)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
