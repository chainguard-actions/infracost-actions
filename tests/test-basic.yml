name: Test basic invocation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action is a placeholder designed for PR workflows.
      # In workflow_dispatch context, github.event.pull_request.base.ref is empty,
      # so the internal checkout step will check out an empty ref (which may succeed
      # or fail depending on git behavior). We use continue-on-error to capture the
      # outcome and assert that the action was at least invoked with valid inputs.
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: test-api-key-placeholder
          path: .
          behavior: update

      - name: Assert action was invoked (inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should either succeed or fail at a known step (not at input parsing).
          # Valid outcomes are 'success', 'failure', or 'skipped'.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action was invoked (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
