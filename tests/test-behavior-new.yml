name: Test behavior new
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action accepts the 'new' behavior input.
      # The action is a placeholder requiring a real PR context and Infracost CLI.
      # It will fail gracefully under the harness (sentinel repo, no real PR).
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: "test-api-key-placeholder"
          path: "."
          behavior: "new"

      - name: Assert action ran (succeeded or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under harness — no real PR, sentinel repo, or Infracost CLI)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
