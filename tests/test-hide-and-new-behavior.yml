name: Test hide-and-new behavior input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test with behavior=hide-and-new. The action requires a PR context,
      # infracost CLI, and a real API key — none of which are available under
      # workflow_dispatch with the sentinel repo. We verify it fails gracefully.
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: "fake-api-key-for-testing"
          path: "."
          behavior: "hide-and-new"

      - name: Assert hide-and-new behavior fails gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully with behavior=hide-and-new (expected: no PR context)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (infracost available in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
