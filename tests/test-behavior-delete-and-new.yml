name: Test behavior delete-and-new
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action accepts the 'delete-and-new' behavior input.
      # The action requires a real PR context and valid Infracost API key.
      # Under the harness, GITHUB_REPOSITORY is a sentinel and there is no real PR,
      # so the action will fail gracefully at the checkout or infracost step.
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: "test-api-key-placeholder"
          path: "."
          behavior: delete-and-new

      - name: Assert action ran and failed gracefully (no real PR context under harness)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no real PR context or valid API key under harness)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (real environment?)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
