name: Test behavior delete-and-new
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action accepts the 'delete-and-new' behavior input.
      # Under the act harness the event is workflow_dispatch and
      # GITHUB_REPOSITORY is a sentinel, so the action cannot complete
      # successfully (no real PR context or valid API key). We assert it
      # fails gracefully rather than panicking.
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key-for-testing
          path: .
          behavior: delete-and-new

      - name: Assert action ran (succeeded or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no real PR context or API key)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
