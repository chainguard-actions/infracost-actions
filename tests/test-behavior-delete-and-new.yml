name: Test behavior=delete-and-new input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action accepts the 'delete-and-new' behavior value.
      # Under the harness, the action will fail at the Infracost setup step
      # because there is no valid API key and no real PR context.
      # We verify it fails gracefully rather than crashing unexpectedly.
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: "test-api-key-placeholder"
          path: "."
          behavior: delete-and-new

      - name: Assert action ran with behavior=delete-and-new (failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no valid API key or PR context under harness)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (possibly a no-op path)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
