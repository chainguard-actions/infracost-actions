name: Test behavior new
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action accepts 'new' as a valid behavior value.
      # Under the act harness, the action will fail gracefully because:
      # - github.event.pull_request.base.ref is empty (workflow_dispatch context)
      # - No valid Infracost API key is provided
      # - The sentinel repo has no real PR to comment on
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: "fake-api-key-for-testing"
          path: "."
          behavior: new

      - name: Assert action ran with new behavior (failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no PR context under harness)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (acceptable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
