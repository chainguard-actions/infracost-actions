name: Test default behavior input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that when behavior is not provided, the action uses the default value 'update'.
      # The action is a placeholder for PR workflows; it will fail internally
      # when there is no PR context (workflow_dispatch), but we verify it was
      # invoked without specifying behavior (relying on the default).
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: test-api-key-placeholder
          path: .
          # behavior is intentionally omitted to test the default value of 'update'

      - name: Assert action was invoked with default behavior
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should be invoked (not skipped due to missing required input).
          # It may fail at an internal step due to no PR context, but it should start.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action was invoked with default behavior (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
