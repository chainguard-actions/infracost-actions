name: Test behavior update (default)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key-for-testing
          path: .
          behavior: update

      - name: Assert action ran with update behavior (expected to fail gracefully without real PR context)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no real PR context or Infracost CLI)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (Infracost CLI may be available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
