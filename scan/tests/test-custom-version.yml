name: Test custom version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-infracost-api-key-for-testing
          path: ${{ github.workspace }}
          version: "0.1.0"

      - name: Assert action ran with custom version (fails gracefully on bad API key)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With version=0.1.0, the action skips the gh release list step and
          # tries to download scanner/v0.1.0 directly. It may fail if that
          # release doesn't exist, or fail at the scan step due to fake API key.
          # Either way, we expect a graceful failure (not a crash/panic).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
