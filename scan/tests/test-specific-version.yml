name: Test specific version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Determine a real scanner version to use
        id: find-version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE=$(gh release list --repo "infracost/actions" --limit 50 --json tagName \
            --jq '[.[] | select(.tagName | startswith("scanner/v"))][0].tagName' 2>/dev/null || echo "")
          if [ -z "$RELEASE" ]; then
            echo "No scanner release found, skipping version test"
            echo "version=skip" >> "$GITHUB_OUTPUT"
          else
            VERSION="${RELEASE#scanner/v}"
            echo "Found version: $VERSION"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Create a minimal Terraform directory to scan
        run: |
          mkdir -p "$GITHUB_WORKSPACE/infra"
          cat > "$GITHUB_WORKSPACE/infra/main.tf" <<'EOF'
          resource "aws_instance" "example" {
            ami           = "ami-0c55b159cbfafe1f0"
            instance_type = "t2.micro"
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: "fake-api-key-for-testing"
          path: "${{ github.workspace }}/infra"
          version: ${{ steps.find-version.outputs.version == 'skip' && 'latest' || steps.find-version.outputs.version }}

      - name: Assert action ran with specific version (fails gracefully on fake API key)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FOUND_VERSION: ${{ steps.find-version.outputs.version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "version used: $FOUND_VERSION"
          # The action should fail at the scanner step due to the fake API key,
          # but the version determination and download steps should succeed.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake API key)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
