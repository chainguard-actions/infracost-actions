name: Test specific version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-infracost-api-key
          path: ${{ github.workspace }}
          version: "0.1.0"

      - name: Assert action ran (fails gracefully with invalid API key or missing release)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (invalid API key or version not found)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
