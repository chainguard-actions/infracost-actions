name: Test explicit version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key
          version: "0.1.0"
          pr-number: "1"
          pr-status: OPEN
          # No base-path/head-path → mode becomes status-only (explicit pr-status + no paths)
          enable-dashboard: "false"
          # With enable-dashboard=false, "Update PR status" is skipped
          # With mode=status-only, "Run scanner" is skipped
          # The action should succeed after downloading the specific version

      - name: Assert action ran with explicit version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed with explicit version 0.1.0"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (version 0.1.0 may not exist or download failed)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
