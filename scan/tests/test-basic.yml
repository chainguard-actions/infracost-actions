name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-infracost-api-key-for-testing
          path: ${{ github.workspace }}
          version: latest

      - name: Assert action ran (download succeeded or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action will fail at the scanner step because the API key is fake.
          # However, the binary download step should succeed using the real GitHub token.
          # We accept either success (unlikely without real key) or failure (expected).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (real API key may have been injected)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (fake API key)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
