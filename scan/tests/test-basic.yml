name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal Terraform file to scan
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/tf-basic"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/tf-basic/main.tf" <<'EOF'
          resource "aws_instance" "example" {
            ami           = "ami-0c55b159cbfafe1f0"
            instance_type = "t2.micro"
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: "fake-api-key-for-testing"
          path: "${{ github.workspace }}/tests/fixtures/tf-basic"

      - name: Assert action ran (scanner fails gracefully without valid API key)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no valid Infracost API key)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
