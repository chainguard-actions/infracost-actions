name: Test project filter input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal Terraform directory to scan
        run: |
          mkdir -p "$GITHUB_WORKSPACE/infra"
          cat > "$GITHUB_WORKSPACE/infra/main.tf" <<'EOF'
          resource "aws_instance" "example" {
            ami           = "ami-0c55b159cbfafe1f0"
            instance_type = "t2.micro"
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: "fake-api-key-for-testing"
          path: "${{ github.workspace }}/infra"
          project: "my-test-project"

      - name: Assert action ran with project filter (fails gracefully on fake API key)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at the scanner step due to the fake API key.
          # The project input should be passed as --project flag to the scanner.
          # We verify the action ran through its steps (version, download, context, scan).
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake API key)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
