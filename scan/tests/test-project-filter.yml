name: Test project filter input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: "fake-api-key-for-testing"
          path: "."
          project: "my-terraform-project"

      - name: Assert action ran with project filter (graceful failure expected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should include --project flag in the scanner args.
          # The scanner will fail with an invalid API key, which is expected.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (invalid API key)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action unexpectedly succeeded"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
