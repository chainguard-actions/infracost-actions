name: Test latest version resolution
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy base and head paths
        run: |
          mkdir -p /tmp/base /tmp/head

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key
          base-path: /tmp/base
          head-path: /tmp/head
          version: "latest"
          pr-number: "1"
          github-owner: "test-owner"
          github-repo: "test-repo"
          commit-sha: "abc1234567890abcdef1234567890abcdef12345"
          repo-url: "https://github.com/test-owner/test-repo"
          branch: "main"

      - name: Assert action ran (version resolution should succeed with real token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may fail at the scanner run step (no real API key / infra),
          # but it should NOT fail at the version resolution step since we have a real token.
          # Any outcome (success or failure) is acceptable here — we just verify it ran.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
