name: Test missing PR number error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy base and head paths
        run: |
          mkdir -p /tmp/base /tmp/head

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key
          base-path: /tmp/base
          head-path: /tmp/head
          version: "latest"
          # pr-number intentionally omitted — workflow_dispatch has no PR context

      - name: Assert action failed with missing PR number error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected when no PR number is available"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed due to missing PR number"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
