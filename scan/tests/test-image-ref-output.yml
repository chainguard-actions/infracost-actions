name: Test image ref is resolved correctly for version 2
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Call the action under test. It will fail at the Docker run step
      # (no real Infracost API key / image pull), but the image-ref resolution
      # step runs first and we can verify the logic via a separate inline step.
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-key-for-image-ref-test
          path: .
          version: "2"

      - name: Assert action reached the scanner step (image ref was resolved)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at the docker run step (not at image resolution),
          # meaning the image ref step succeeded. Either failure or success is
          # acceptable here — what matters is it didn't exit before resolving the ref.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (image ref step was reached)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      # Verify the image ref resolution logic independently for version "2"
      - name: Verify image ref resolution for version 2
        id: image-v2
        shell: bash
        env:
          VERSION: "2"
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/infracost/ci"
          case "$VERSION" in
            "")
              echo "::error::version must be a ghcr.io/infracost/ci tag or sha256: digest"
              exit 1
              ;;
            sha256:*)
              if ! [[ "${VERSION#sha256:}" =~ ^[0-9a-f]{64}$ ]]; then
                echo "::error::version ${VERSION} is not a digest."
                exit 1
              fi
              REF="${IMAGE}@${VERSION}"
              ;;
            latest)
              REF="${IMAGE}:latest"
              ;;
            *)
              if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*))*(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
                echo "::error::version ${VERSION} is not a valid tag."
                exit 1
              fi
              MAJOR="${VERSION%%[.-]*}"
              if [ "${#MAJOR}" -eq 1 ] && [ "$MAJOR" -lt 2 ]; then
                echo "::error::version ${VERSION} is below 2.0.0"
                exit 1
              fi
              REF="${IMAGE}:${VERSION}"
              ;;
          esac
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Assert image ref for version 2
        env:
          ACTUAL: ${{ steps.image-v2.outputs.ref }}
        run: |
          echo "actual: $ACTUAL"
          EXPECTED="ghcr.io/infracost/ci:2"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: expected '$EXPECTED', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: image ref resolved correctly for version 2"

      # Verify the image ref resolution logic for a sha256 digest
      - name: Verify image ref resolution for sha256 digest
        id: image-sha
        shell: bash
        env:
          VERSION: "sha256:a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2"
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/infracost/ci"
          case "$VERSION" in
            sha256:*)
              if ! [[ "${VERSION#sha256:}" =~ ^[0-9a-f]{64}$ ]]; then
                echo "::error::version ${VERSION} is not a digest."
                exit 1
              fi
              REF="${IMAGE}@${VERSION}"
              ;;
            *)
              REF="${IMAGE}:${VERSION}"
              ;;
          esac
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Assert image ref for sha256 digest
        env:
          ACTUAL: ${{ steps.image-sha.outputs.ref }}
        run: |
          echo "actual: $ACTUAL"
          EXPECTED="ghcr.io/infracost/ci@sha256:a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: expected '$EXPECTED', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: sha256 image ref resolved correctly"
