name: Test project input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a scan target directory
        run: mkdir -p "$GITHUB_WORKSPACE/scan-target"

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key-for-project-test
          path: scan-target
          version: "2"
          project: my-test-project

      - name: Assert action ran (project input accepted, Docker step attempted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail because the API key is fake and
          # the infracost/ci Docker image will reject it. What we verify is
          # that the action ran (not skipped) and that the 'project' input
          # was accepted without causing an early validation error.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with project input (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME' — step may have been skipped"
            exit 1
          fi
