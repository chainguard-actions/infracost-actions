name: Test latest version tag is accepted with warning
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal scan path
        run: mkdir -p "$GITHUB_WORKSPACE/infra"

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-key-for-test
          path: infra
          version: "latest"

      - name: Assert action ran (latest version accepted at resolution step)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # 'latest' is a valid version tag; the action should pass version resolution
          # (emitting a warning). The docker run may fail in the test environment
          # (no real API key/network), but must NOT fail at version-resolution.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully at docker run (expected in test env)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
