name: Test non-existent path is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-key-for-validation
          path: this-path-does-not-exist
          version: "2"

      - name: Assert action failed due to non-existent path
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for non-existent path, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly rejected non-existent path"
