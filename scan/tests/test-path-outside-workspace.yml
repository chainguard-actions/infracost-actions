name: Test path outside workspace is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a directory outside workspace
        run: mkdir -p /tmp/outside-workspace-dir

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-key-for-validation
          path: /tmp/outside-workspace-dir
          version: "2"

      - name: Assert action failed due to path outside workspace
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for path outside workspace, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly rejected path outside GITHUB_WORKSPACE"
