name: Test derived repo URL (no repo-url input)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: "fake-api-key-for-testing"
          path: "."
          version: "0.1.0"
          # repo-url intentionally omitted to test auto-derivation from GITHUB_SERVER_URL + GITHUB_REPOSITORY

      - name: Assert action ran (repo-url derived from context)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action derives repo-url from GITHUB_SERVER_URL + GITHUB_REPOSITORY when not provided.
          # It will fail at 'Run scanner' due to fake API key, but should not fail at 'Derive context'.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (fake API key), repo-url derivation succeeded"
          elif [ "$OUTCOME" = "success" ]; then
            echo "WARN: action unexpectedly succeeded with a fake API key"
            echo "PASS"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
