name: Test missing scan paths fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key
          pr-number: "1"
          # No pr-status → mode = scan
          # No base-path or head-path → "Run scanner" step should fail
          enable-dashboard: "false"

      - name: Assert action failed due to missing scan paths
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (missing base-path and head-path for scan mode)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected action to fail but it succeeded"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
