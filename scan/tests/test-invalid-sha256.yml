name: Test invalid sha256 digest is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal scan path
        run: mkdir -p "$GITHUB_WORKSPACE/infra"

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-key-for-test
          path: infra
          version: "sha256:tooshort"

      - name: Assert action failed due to invalid sha256 digest
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for invalid sha256 digest 'sha256:tooshort', got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly rejected invalid sha256 digest"
