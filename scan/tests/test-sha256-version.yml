name: Test sha256 digest version is accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal scan path
        run: mkdir -p "$GITHUB_WORKSPACE/infra"

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-key-for-test
          path: infra
          version: "sha256:a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2"

      - name: Assert action ran (sha256 digest accepted at version-resolution step)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The sha256 digest is valid format; the action should pass version resolution.
          # The docker run may fail in the test environment (no real API key/network),
          # but it must NOT fail at the version-resolution step.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully at docker run (expected in test env)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
