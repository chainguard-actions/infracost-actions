name: Test repo-url input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create scan path
        run: mkdir -p "$GITHUB_WORKSPACE/infra-repo"

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key-for-test
          path: infra-repo
          version: "2"
          repo-url: https://github.com/example/my-infra-repo

      - name: Assert action ran with repo-url input (fails at Docker/auth, not input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at the Docker run stage (bad API key / no real infracost),
          # NOT at input validation. Either outcome (success/failure) is acceptable here
          # as long as it is not 'skipped' (which would mean the step never ran).
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped — it should have run"
            exit 1
          fi
          echo "PASS: action ran with repo-url input (outcome=$OUTCOME)"
