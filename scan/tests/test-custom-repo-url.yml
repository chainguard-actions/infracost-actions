name: Test custom repo-url input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal Terraform file to scan
        run: |
          mkdir -p "$GITHUB_WORKSPACE/infra"
          cat > "$GITHUB_WORKSPACE/infra/main.tf" <<'EOF'
          resource "aws_instance" "example" {
            ami           = "ami-0c55b159cbfafe1f0"
            instance_type = "t2.micro"
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: "fake-api-key-for-testing"
          path: "${{ github.workspace }}/infra"
          version: "0.1.0"
          repo-url: "https://github.com/example/my-infra-repo"

      - name: Assert action ran with custom repo-url (failed gracefully on invalid API key)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The custom repo-url is passed through to the scanner via --repo-url.
          # The scanner will fail due to the invalid API key, but the action
          # should not crash before reaching the Run scanner step.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (scanner accepted fake key)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (invalid API key)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
