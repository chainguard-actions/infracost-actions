name: Test custom repo-url input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-infracost-api-key-for-testing
          path: ${{ github.workspace }}
          version: latest
          repo-url: https://github.com/example/my-infra-repo

      - name: Assert action ran with custom repo-url (fails gracefully on bad API key)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should use the provided repo-url instead of deriving it
          # from GITHUB_SERVER_URL/GITHUB_REPOSITORY. It will fail at the scanner
          # step due to the fake API key, but should not crash before that.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (fake API key)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
