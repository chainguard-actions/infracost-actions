name: "Infracost Scan"
description: "Scan infrastructure code and upload baseline cost data to the Infracost dashboard."
inputs:
  api-key:
    description: "Infracost API key for authentication."
    required: true
  path:
    description: "Path to the directory to scan."
    required: true
  version:
    description: "Version of the scanner to use (e.g. 0.1.0). Defaults to latest."
    required: false
    default: "latest"
  project:
    description: "Filter scanning to a single project."
    required: false
  repo-url:
    description: "Repository URL for metadata."
    required: false
  github-token:
    description: "GitHub API token used to download the scanner binary."
    required: false
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: Determine version
      id: version
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        VERSION: ${{ inputs.version }}
      run: |
        write_output() {
          local name="$1"
          local value
          value="$(printf '%s' "$2" | tr -d '\n\r')"
          local delimiter
          delimiter="ghadelimiter_${RANDOM}_${RANDOM}_${RANDOM}_${RANDOM}"

          {
            printf '%s<<%s\n' "$name" "$delimiter"
            printf '%s\n' "$value"
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_OUTPUT"
        }

        if [ "$VERSION" = "latest" ]; then
          RELEASE=$(gh release list --repo "infracost/actions" --limit 50 --json tagName --jq '[.[] | select(.tagName | startswith("scanner/v"))][0].tagName')
          if [ -z "$RELEASE" ]; then
            echo "::error::No scanner release found"
            exit 1
          fi
          VERSION="${RELEASE#scanner/v}"
        fi
        write_output "version" "$VERSION"
        write_output "tag" "scanner/v${VERSION}"
    - name: Download scanner
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TAG: ${{ steps.version.outputs.tag }}
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')
        ARCH=$(uname -m)
        case "$ARCH" in
          x86_64) ARCH="amd64" ;;
          aarch64|arm64) ARCH="arm64" ;;
        esac

        ARCHIVE="infracost-scanner_${VERSION}_${OS}_${ARCH}.tar.gz"
        DEST="${RUNNER_TEMP}/infracost-scanner"

        gh release download "$TAG" \
          --repo "infracost/actions" \
          --pattern "$ARCHIVE" \
          --dir "$RUNNER_TEMP"

        mkdir -p "$(dirname "$DEST")"
        tar -xzf "${RUNNER_TEMP}/${ARCHIVE}" -C "$RUNNER_TEMP"
        chmod +x "$DEST"
        echo "${RUNNER_TEMP}" >> $GITHUB_PATH
    - name: Derive context
      id: context
      shell: bash
      env:
        INPUT_REPO_URL: ${{ inputs.repo-url }}
      run: |
        write_output() {
          local name="$1"
          local value
          value="$(printf '%s' "$2" | tr -d '\n\r')"
          local delimiter
          delimiter="ghadelimiter_${RANDOM}_${RANDOM}_${RANDOM}_${RANDOM}"

          {
            printf '%s<<%s\n' "$name" "$delimiter"
            printf '%s\n' "$value"
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_OUTPUT"
        }

        REPO_URL="$INPUT_REPO_URL"

        if [ -z "$REPO_URL" ]; then
          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
        fi

        write_output "repo-url" "$REPO_URL"
    - name: Run scanner
      shell: bash
      env:
        INFRACOST_CLI_AUTHENTICATION_TOKEN: ${{ inputs.api-key }}
        INFRACOST_CLI_LOG_LEVEL: info
        INPUT_PATH: ${{ inputs.path }}
        INPUT_PROJECT: ${{ inputs.project }}
        CONTEXT_REPO_URL: ${{ steps.context.outputs.repo-url }}
      run: |
        ARGS=(
          scan
          --path "$INPUT_PATH"
          --repo-url "$CONTEXT_REPO_URL"
          --pipeline-run-id "${GITHUB_RUN_ID}"
        )

        if [ -n "$INPUT_PROJECT" ]; then
          ARGS+=(--project "$INPUT_PROJECT")
        fi

        infracost-scanner "${ARGS[@]}"
