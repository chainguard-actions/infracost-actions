name: Test Infracost setup with specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          api-key: ci-test-fake-api-key-for-install-only
          version: 0.10.x
        continue-on-error: true
      - name: Assert infracost binary is installed at expected version or action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if command -v infracost >/dev/null 2>&1; then
            VERSION_OUTPUT="$(infracost --version 2>&1)"
            echo "version output: $VERSION_OUTPUT"
            # Verify the version starts with 0.10
            if echo "$VERSION_OUTPUT" | grep -qE '0\.10\.[0-9]+'; then
              echo "PASS: infracost 0.10.x installed correctly"
            else
              echo "FAIL: expected version 0.10.x but got: $VERSION_OUTPUT"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed gracefully (expected with fake API key)"
          else
            echo "FAIL: infracost binary not found and outcome was: $OUTCOME"
            exit 1
          fi
