name: Test specific version install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key-for-testing
          version: 0.10.x
      - name: Assert action ran with specific version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            # Verify the binary is on PATH and check version output
            if ! command -v infracost > /dev/null 2>&1; then
              echo "FAIL: action succeeded but infracost binary not found on PATH"
              exit 1
            fi
            VERSION_OUTPUT=$(infracost --version 2>&1 || true)
            echo "version output: $VERSION_OUTPUT"
            # Version should contain 0.10
            if echo "$VERSION_OUTPUT" | grep -q "0\.10"; then
              echo "PASS: infracost 0.10.x installed correctly"
            else
              echo "FAIL: expected version 0.10.x but got: $VERSION_OUTPUT"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake API key)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
