name: Test specific version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY || 'ico-test-key-placeholder' }}
          version: 0.10.x
      - name: Assert infracost binary is available
        run: |
          echo "Checking infracost binary..."
          if ! command -v infracost &>/dev/null; then
            echo "FAIL: infracost binary not found in PATH"
            exit 1
          fi
          echo "PASS: infracost binary found at $(command -v infracost)"
      - name: Assert infracost version is 0.10.x
        run: |
          echo "Checking infracost version..."
          VERSION_OUTPUT=$(infracost --version 2>&1 || true)
          echo "version output: $VERSION_OUTPUT"
          if echo "$VERSION_OUTPUT" | grep -qE 'v?0\.10\.'; then
            echo "PASS: version matches 0.10.x"
          else
            echo "FAIL: expected version 0.10.x but got: $VERSION_OUTPUT"
            exit 1
          fi
