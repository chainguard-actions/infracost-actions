name: Test specific version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        continue-on-error: true
        with:
          api-key: test-fake-api-key-for-ci
          version: 0.10.x
      - name: Assert specific version installed
        env:
          OUTCOME: ${{ steps.setup.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if command -v infracost >/dev/null 2>&1; then
            VERSION_OUTPUT="$(infracost --version 2>&1)"
            echo "version output: $VERSION_OUTPUT"
            # Verify it's a 0.10.x version
            if echo "$VERSION_OUTPUT" | grep -qE 'v?0\.10\.'; then
              echo "PASS: infracost 0.10.x installed correctly"
            else
              echo "FAIL: expected 0.10.x version, got: $VERSION_OUTPUT"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed gracefully (expected with fake API key)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME' and infracost not found"
            exit 1
          fi
