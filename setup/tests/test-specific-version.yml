name: Test Infracost setup with specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: setup
        uses: .
        with:
          api-key: ico-test-api-key-for-ci-testing-only
          version: 0.10.x
        continue-on-error: true

      - name: Assert infracost binary is installed at expected version or action ran
        env:
          OUTCOME: ${{ steps.setup.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            # Verify the binary is on PATH
            if ! command -v infracost >/dev/null 2>&1; then
              echo "FAIL: infracost binary not found on PATH after successful setup"
              exit 1
            fi
            VERSION_OUTPUT="$(infracost --version 2>&1 || true)"
            echo "version output: $VERSION_OUTPUT"
            # Check that the version starts with 0.10
            if echo "$VERSION_OUTPUT" | grep -qE '0\.10\.[0-9]+'; then
              echo "PASS: infracost 0.10.x installed"
            else
              echo "FAIL: expected version 0.10.x but got: $VERSION_OUTPUT"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with test API key or network issues)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
