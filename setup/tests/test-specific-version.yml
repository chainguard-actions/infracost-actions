name: Test Infracost setup with specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          api-key: test-api-key-for-ci
          version: 0.10.x
          github-token: ${{ github.token }}
        continue-on-error: true
      - name: Assert infracost CLI version or setup ran
        env:
          OUTCOME: ${{ steps.setup.outcome }}
        run: |
          echo "setup outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Setup succeeded, checking infracost version..."
            if ! command -v infracost >/dev/null 2>&1; then
              echo "FAIL: infracost not found in PATH after successful setup"
              exit 1
            fi
            VERSION_OUTPUT="$(infracost --version 2>&1 || true)"
            echo "infracost version output: $VERSION_OUTPUT"
            if echo "$VERSION_OUTPUT" | grep -q "0\.10\."; then
              echo "PASS: infracost 0.10.x installed as expected"
            else
              echo "FAIL: expected version 0.10.x but got: $VERSION_OUTPUT"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (may have failed due to invalid API key or network, but setup step executed)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
