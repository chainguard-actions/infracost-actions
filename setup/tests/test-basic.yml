name: Test basic setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: test-api-key-placeholder
          version: 0.10.x
      - name: Assert infracost binary is installed or action failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            # If the action succeeded, verify the binary is on PATH
            if ! command -v infracost >/dev/null 2>&1; then
              echo "FAIL: action succeeded but infracost binary not found on PATH"
              exit 1
            fi
            echo "PASS: infracost binary found at $(command -v infracost)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with placeholder API key)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
