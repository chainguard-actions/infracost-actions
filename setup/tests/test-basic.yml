name: Test basic setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        continue-on-error: true
        with:
          api-key: ico-fake-api-key-for-testing-only
          version: 0.10.x
      - name: Assert infracost binary is installed or action failed gracefully
        env:
          OUTCOME: ${{ steps.setup.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            # Binary should be on PATH
            if ! command -v infracost > /dev/null 2>&1; then
              echo "FAIL: infracost binary not found in PATH after successful setup"
              exit 1
            fi
            echo "PASS: infracost binary found at $(command -v infracost)"
            infracost --version
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake API key or network issues)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
