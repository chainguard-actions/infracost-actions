name: Test basic setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        continue-on-error: true
        with:
          api-key: test-fake-api-key-for-ci
          version: 0.10.x
      - name: Assert infracost binary is installed or action ran
        env:
          OUTCOME: ${{ steps.setup.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action installs the CLI binary regardless of API key validity.
          # Check if infracost binary is on PATH.
          if command -v infracost >/dev/null 2>&1; then
            echo "PASS: infracost binary found on PATH"
            infracost --version
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed gracefully (expected with fake API key)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME' and infracost not found"
            exit 1
          fi
