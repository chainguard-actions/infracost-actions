name: Test enable dashboard
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: "ico-fake-api-key-for-testing"
          enable-dashboard: "true"
      - name: Assert action ran with dashboard enabled
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            # If it succeeded, verify infracost CLI is on PATH
            if ! command -v infracost >/dev/null 2>&1; then
              echo "FAIL: action succeeded but infracost CLI not found on PATH"
              exit 1
            fi
            echo "PASS: infracost CLI installed with dashboard enabled"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake API key)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
