name: Test Infracost setup with dashboard enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          api-key: test-api-key-for-ci
          enable-dashboard: "true"
          github-token: ${{ github.token }}
        continue-on-error: true
      - name: Assert setup ran with dashboard enabled
        env:
          OUTCOME: ${{ steps.setup.outcome }}
        run: |
          echo "setup outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Setup succeeded with dashboard enabled"
            if ! command -v infracost >/dev/null 2>&1; then
              echo "FAIL: infracost not found in PATH after successful setup"
              exit 1
            fi
            echo "infracost version: $(infracost --version 2>&1 || true)"
            echo "PASS: infracost CLI installed with dashboard enabled"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (may have failed due to invalid API key or network, but setup step executed)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
