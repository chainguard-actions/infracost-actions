name: Test custom currency
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY || 'ico-test-api-key-placeholder' }}
          currency: EUR
      - name: Assert infracost CLI is installed
        run: |
          echo "Checking infracost binary..."
          if ! command -v infracost &>/dev/null; then
            echo "FAIL: infracost binary not found in PATH"
            exit 1
          fi
          echo "PASS: infracost binary found"
      - name: Assert currency is configured as EUR
        run: |
          CURRENCY=$(infracost configure get currency 2>&1 || true)
          echo "currency: $CURRENCY"
          if echo "$CURRENCY" | grep -q 'EUR'; then
            echo "PASS: currency is set to EUR"
          else
            echo "FAIL: expected EUR currency but got: $CURRENCY"
            exit 1
          fi
