name: Test Infracost setup with custom currency
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          api-key: test-api-key-for-ci
          version: 0.10.x
          currency: EUR
        continue-on-error: true
      - name: Assert action ran with currency option
        env:
          OUTCOME: ${{ steps.setup.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            if command -v infracost >/dev/null 2>&1; then
              echo "PASS: infracost CLI installed with EUR currency configuration"
              infracost --version
            else
              echo "FAIL: infracost CLI not found in PATH after successful setup"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
