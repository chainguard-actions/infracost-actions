name: Test custom currency configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY || 'ico-test-key-placeholder' }}
          currency: EUR
      - name: Assert infracost binary is available
        run: |
          echo "Checking infracost binary..."
          if ! command -v infracost &>/dev/null; then
            echo "FAIL: infracost binary not found in PATH"
            exit 1
          fi
          echo "PASS: infracost binary found at $(command -v infracost)"
      - name: Assert currency is configured as EUR
        run: |
          echo "Checking infracost currency configuration..."
          CURRENCY=$(infracost configure get currency 2>&1 || true)
          echo "currency: $CURRENCY"
          if [ "$CURRENCY" = "EUR" ]; then
            echo "PASS: currency is set to EUR"
          else
            echo "FAIL: expected currency EUR but got: $CURRENCY"
            exit 1
          fi
