name: Test custom version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY || 'ico-test-api-key-placeholder' }}
          version: 0.10.x
      - name: Assert infracost CLI is installed at expected version
        run: |
          echo "Checking infracost binary..."
          if ! command -v infracost &>/dev/null; then
            echo "FAIL: infracost binary not found in PATH"
            exit 1
          fi
          VERSION_OUTPUT=$(infracost --version 2>&1 || true)
          echo "version output: $VERSION_OUTPUT"
          if echo "$VERSION_OUTPUT" | grep -qiE 'v0\.10'; then
            echo "PASS: version 0.10.x installed as expected"
          else
            echo "FAIL: expected v0.10.x but got: $VERSION_OUTPUT"
            exit 1
          fi
