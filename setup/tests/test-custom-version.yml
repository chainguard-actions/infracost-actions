name: Test custom version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          api-key: test-api-key-for-ci
          version: 0.10.x
        continue-on-error: true
      - name: Assert specific version installed or action ran
        env:
          OUTCOME: ${{ steps.setup.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            if command -v infracost >/dev/null 2>&1; then
              VERSION_OUTPUT="$(infracost --version 2>&1)"
              echo "version output: $VERSION_OUTPUT"
              # Version should be in the 0.10.x range
              if echo "$VERSION_OUTPUT" | grep -qE '0\.10\.[0-9]+'; then
                echo "PASS: infracost version 0.10.x installed"
              else
                echo "FAIL: expected version 0.10.x but got: $VERSION_OUTPUT"
                exit 1
              fi
            else
              echo "FAIL: action succeeded but infracost binary not found"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in restricted CI environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
