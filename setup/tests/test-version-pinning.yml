name: Test version pinning
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: test-api-key-placeholder
          version: 0.10.x
          github-token: ${{ github.token }}
      - name: Assert action ran and binary version matches if installed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            if ! command -v infracost >/dev/null 2>&1; then
              echo "FAIL: action succeeded but infracost binary not found on PATH"
              exit 1
            fi
            VERSION_OUTPUT="$(infracost --version 2>&1 || true)"
            echo "version output: $VERSION_OUTPUT"
            # Verify it reports a 0.10.x version
            if echo "$VERSION_OUTPUT" | grep -qE 'v?0\.10\.'; then
              echo "PASS: infracost version matches 0.10.x"
            else
              echo "FAIL: version output does not match 0.10.x: $VERSION_OUTPUT"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with placeholder API key)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
