name: Test version pinning
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        continue-on-error: true
        with:
          api-key: ico-fake-api-key-for-testing-only
          version: 0.10.x
          github-token: ${{ github.token }}
      - name: Assert infracost binary is installed at expected version or failed gracefully
        env:
          OUTCOME: ${{ steps.setup.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            if ! command -v infracost > /dev/null 2>&1; then
              echo "FAIL: infracost binary not found in PATH"
              exit 1
            fi
            VERSION_OUTPUT="$(infracost --version 2>&1)"
            echo "version output: $VERSION_OUTPUT"
            # Check that the version starts with 0.10
            if echo "$VERSION_OUTPUT" | grep -qE '0\.10\.[0-9]+'; then
              echo "PASS: infracost version matches 0.10.x"
            else
              echo "FAIL: infracost version does not match 0.10.x: $VERSION_OUTPUT"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake API key or network issues)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
