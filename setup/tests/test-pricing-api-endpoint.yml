name: Test pricing-api-endpoint input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY || 'ico-test-key-placeholder' }}
          pricing-api-endpoint: https://cloud-pricing-api.example.com
          version: 0.10.x
      - name: Assert action ran with pricing-api-endpoint input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may fail because the self-hosted pricing-api-endpoint is not real,
          # but it must not be skipped — it must have run (success or failure).
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with pricing-api-endpoint input (outcome: $OUTCOME)"
