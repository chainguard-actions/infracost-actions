name: Test pricing-api-endpoint input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY || 'ico-test-key-placeholder' }}
          pricing-api-endpoint: https://cloud-pricing-api.example.com
          version: 0.10.x
      - name: Assert action ran with pricing-api-endpoint input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may succeed (if it installs the CLI without validating the endpoint)
          # or fail gracefully (if it tries to reach the custom endpoint during setup).
          # Either outcome is acceptable — what matters is that the input was accepted
          # and the action did not crash unexpectedly (e.g. with a missing-input error).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action handled pricing-api-endpoint input (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
