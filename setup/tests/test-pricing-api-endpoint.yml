name: Test pricing-api-endpoint input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: test-api-key-for-self-hosted
          pricing-api-endpoint: https://cloud-pricing-api.example.com
          version: 0.10.x
      - name: Assert action ran with pricing-api-endpoint input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may succeed (CLI installed and configured) or fail
          # (cannot reach the self-hosted endpoint or invalid API key).
          # Either is acceptable — what matters is that the input was accepted
          # and the action did not crash unexpectedly (i.e. outcome is not 'skipped').
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with pricing-api-endpoint set"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with unreachable self-hosted endpoint)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
