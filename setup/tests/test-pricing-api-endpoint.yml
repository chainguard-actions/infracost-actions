name: Test pricing-api-endpoint input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY || 'ico-fake-key-for-testing-only' }}
          version: 0.10.x
          pricing-api-endpoint: https://cloud-pricing-api.example.com
      - name: Assert action ran (pricing-api-endpoint input exercised)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with pricing-api-endpoint input"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
