name: Test pricing-api-endpoint input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY || 'ico-fake-key-for-testing' }}
          pricing-api-endpoint: https://cloud-pricing-api.example.com
          version: 0.10.x
      - name: Assert action ran with pricing-api-endpoint input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may succeed (if it can install the CLI) or fail gracefully
          # (if the fake pricing-api-endpoint causes issues). Either way, we
          # verify the step ran and did not produce an unexpected outcome.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with pricing-api-endpoint set"
            # Verify infracost binary is available
            if command -v infracost >/dev/null 2>&1; then
              echo "PASS: infracost CLI is installed"
              infracost --version || true
            else
              echo "INFO: infracost not found on PATH (may be in a non-standard location)"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake pricing-api-endpoint or fake API key)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
