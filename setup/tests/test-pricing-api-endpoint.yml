name: Test pricing-api-endpoint input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY || 'ico-test-key-placeholder' }}
          pricing-api-endpoint: https://cloud-pricing-api.example.com
          version: 0.10.x
      - name: Assert action ran with pricing-api-endpoint input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may succeed (if it installs the CLI) or fail gracefully
          # (if the self-hosted endpoint is unreachable). Either is acceptable —
          # what matters is that the pricing-api-endpoint input was accepted and
          # the action did not crash unexpectedly (i.e. outcome is not 'skipped').
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with pricing-api-endpoint input (outcome: $OUTCOME)"
